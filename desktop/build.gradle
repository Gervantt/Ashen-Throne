apply plugin: 'java'

def desktopMainClass = 'com.ashenthrone.desktop.DesktopLauncher'

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

sourceSets.main.resources.srcDirs += [project(':core').file('assets')]

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
}

task run(type: JavaExec) {
    group = 'application'
    description = 'Runs the desktop application'
    mainClass.set(desktopMainClass)
    classpath = sourceSets.main.runtimeClasspath
    workingDir = project(':core').file('assets')
    if (System.getProperty('os.name').toLowerCase().contains('mac')) {
        jvmArgs '-XstartOnFirstThread'
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': desktopMainClass
    }
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
}

tasks.register('dist', Jar) {
    group = 'distribution'
    description = 'Builds a runnable desktop JAR with game assets and dependencies'
    archiveBaseName.set('ashen-throne')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn classes
    manifest {
        attributes 'Main-Class': desktopMainClass
    }
    from sourceSets.main.output
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
}
